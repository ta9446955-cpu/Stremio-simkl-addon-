<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simkl Sync — Stremio Addon</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { margin-bottom: 4px; }
  p { color: #aaa; max-width: 420px; }
  button {
    background: #4a90e2;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:disabled { background: #555; }
  #code {
    font-size: 32px;
    letter-spacing: 4px;
    margin: 20px 0;
    font-weight: bold;
    color: #4a90e2;
  }
  #linkBox { margin-top: 4px; color: #ccc; max-width: 420px; }
  #status { margin-top: 16px; color: #ccc; }
  #manifestBox {
    display: none;
    margin-top: 24px;
    padding: 16px;
    background: #1a1d24;
    border-radius: 8px;
    word-break: break-all;
    max-width: 420px;
  }
  a.install-link {
    display: inline-block;
    margin-top: 12px;
    background: #2ecc71;
    color: #fff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <h1>Simkl Sync</h1>
  <p>Connect your Simkl account to get a personal Stremio addon showing your watched and plan-to-watch movies and TV shows.</p>

  <button id="connectBtn" onclick="startAuth()">Connect to Simkl</button>

  <div id="code"></div>
  <div id="linkBox"></div>
  <div id="status"></div>

  <div id="manifestBox">
    <p>Your addon is ready:</p>
    <div id="manifestUrl"></div>
    <a id="installLink" class="install-link" href="#">Install in Stremio</a>
  </div>

  <script>
    let pollTimer = null;

    async function startAuth() {
      const btn = document.getElementById('connectBtn');
      const codeEl = document.getElementById('code');
      const linkEl = document.getElementById('linkBox');
      const statusEl = document.getElementById('status');

      btn.disabled = true;
      statusEl.textContent = 'Requesting code from Simkl...';
      linkEl.innerHTML = '';

      try {
        const res = await fetch('/auth/start');
        const data = await res.json();

        if (!data.user_code) {
          statusEl.textContent = 'Error getting code. Check server logs / env vars.';
          btn.disabled = false;
          return;
        }

        codeEl.textContent = data.user_code;

        // This link stays on screen — polling below only updates #status, never #linkBox.
        linkEl.innerHTML = 'Go to <a href="' + data.verification_url + '" target="_blank" style="color:#4a90e2;">' +
          data.verification_url + '</a> and enter this code.';
        statusEl.textContent = 'Waiting for you to approve at Simkl...';

        const interval = (data.interval || 5) * 1000;
        pollTimer = setInterval(() => pollAuth(data.user_code), interval);
      } catch (err) {
        statusEl.textContent = 'Server error: ' + err.message;
        btn.disabled = false;
      }
    }

    async function pollAuth(userCode) {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('/auth/poll/' + userCode);
        const data = await res.json();

        if (data.status === 'connected') {
          clearInterval(pollTimer);
          statusEl.textContent = 'Connected!';

          const manifestUrl = window.location.origin + '/' + data.userId + '/manifest.json';
          document.getElementById('manifestUrl').textContent = manifestUrl;
          document.getElementById('manifestBox').style.display = 'block';

          const stremioLink = 'stremio://' + manifestUrl.replace(/^https?:\/\//, '');
          document.getElementById('installLink').href = stremioLink;
        } else {
          statusEl.textContent = 'Waiting for you to approve at Simkl...';
        }
      } catch (err) {
        statusEl.textContent = 'Polling error: ' + err.message;
      }
    }
  </script>
</body>
</html>
